name: Build Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install pkg
        run: npm install -g pkg

      - name: Build Windows executable
        run: pkg . --targets node18-win-x64 --output dist/excel-generator-win.exe

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-executable
          path: dist/*.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install pkg
        run: npm install -g pkg

      - name: Build macOS executable
        run: pkg . --targets node18-macos-x64 --output dist/excel-generator-macos

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-executable
          path: dist/excel-generator-macos

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install pkg
        run: npm install -g pkg

      - name: Build Linux executable
        run: pkg . --targets node18-linux-x64 --output dist/excel-generator-linux

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-executable
          path: dist/excel-generator-linux

  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: List files
        run: ls -laR

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          body: |
            Excel批量生成工具 V${{ github.ref_name }}

            下载后直接运行，无需安装 Node.js！

            Windows: excel-generator-win.exe
            macOS: excel-generator-macos
            Linux: excel-generator-linux

            使用方法：
            1. 下载对应平台的可执行文件
            2. 双击运行（Windows/macOS）或在终端运行（Linux）
            3. 浏览器访问 http://localhost:3000
          files: |
            windows-executable/*.exe
            macos-executable/*
            linux-executable/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
